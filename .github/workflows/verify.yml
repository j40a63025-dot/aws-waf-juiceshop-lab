name: Verify telemetry
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: test_db
        ports: ["5432/tcp"]
        options: --health-cmd "pg_isready -U test_user -d test_db" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      - run: python -m pip install -r telemetry/requirements-dev.txt
      - run: python -m pytest -q telemetry
        env:
          TEST_DATABASE_URL: postgresql://test_user:test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/test_db
      - run: |
          docker compose up -d --build --wait --wait-timeout 90
          curl --fail --silent --show-error -H 'Content-Type: application/json' --data @telemetry/sample.json http://127.0.0.1:8000/events
          curl --fail --silent --show-error http://127.0.0.1:8000/summary
      - if: always()
        run: docker compose down --volumes
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: {terraform_version: "1.14.3", terraform_wrapper: false}
      - run: terraform -chdir=terraform fmt -check
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
